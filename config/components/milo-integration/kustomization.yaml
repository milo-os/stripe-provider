apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# milo-integration wires the stripe-provider controller into a Milo
# control plane. It carries only the bits that are universal to every
# Milo deployment — operator-specific concerns (which trust bundle, which
# cert-manager Issuer, which ConfigMap names) live in the consuming
# operator's overlay.
#
# What this Component does:
#
#   - Sets `KUBECONFIG` so `ctrl.GetConfigOrDie()` reads the kubeconfig
#     mounted at `/etc/kubernetes/project-discovery/auth/kubeconfig.yaml`.
#     The controller then talks to Milo for every resource (its own CRDs,
#     billing's CRDs, leader-election Leases).
#   - Sets `LEADER_ELECT_NAMESPACE=milo-system` because the upstream
#     default (`kube-system`) does not exist on the Milo apiserver.
#   - Removes the base Deployment's Secret-based webhook-tls volume and
#     mount so the operator can replace them with whatever issuance
#     mechanism it prefers (cert-manager CSI, mounted Secret, etc.)
#     without a strategic-merge collision.
#   - Adds `volumeMounts` for the four mount paths the controller expects
#     at runtime (trust bundle, webhook TLS, client cert, discovery
#     kubeconfig). The matching `volumes:` are intentionally *not*
#     provided — consumers wire those in their own overlay so the
#     ConfigMap names, Issuers, and certificate parameters are operator
#     choices, not upstream defaults.
#
# What the consuming operator must add downstream:
#
#   - A `trust-bundle` Volume sourced from a ConfigMap of its choosing,
#     populated with the CA bundle the controller should trust for the
#     Milo apiserver.
#   - A `webhook-tls` Volume issuing a serving cert for the
#     stripe-provider webhook Service.
#   - A `client-cert` Volume issuing the controller's client cert for
#     authenticating to Milo as
#     `system:control@stripe.billing.miloapis.com`
#     (CN/Org chosen so Milo's auth chain recognises it).
#   - A `discovery-kubeconfig` Volume sourced from a ConfigMap describing
#     how to reach Milo (the `KUBECONFIG` env var above points at it).
#   - The controller's ClusterRole / ClusterRoleBinding on Milo so the
#     cert-authenticated identity has RBAC there.

patches:
  # Remove the base Secret-based webhook-tls volume and volumeMount so
  # downstream overlays can replace them cleanly. A strategic merge of
  # same-named volumes would produce an invalid spec with both `secret`
  # and `csi`/replacement fields set.
  - target:
      kind: Deployment
      name: stripe-provider
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/0
      - op: remove
        path: /spec/template/spec/volumes/0

  # Set Milo-specific env and declare the runtime mount points the
  # controller expects. Volumes themselves are operator-provided.
  - target:
      kind: Deployment
      name: stripe-provider
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: stripe-provider
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                  - name: KUBECONFIG
                    value: /etc/kubernetes/project-discovery/auth/kubeconfig.yaml
                  - name: LEADER_ELECT_NAMESPACE
                    value: milo-system
                volumeMounts:
                  - mountPath: /etc/kubernetes/pki/trust
                    name: trust-bundle
                    readOnly: true
                  - mountPath: /tmp/k8s-webhook-server/serving-certs
                    name: webhook-tls
                    readOnly: true
                  - mountPath: /etc/kubernetes/projects/pki/client
                    name: client-cert
                    readOnly: true
                  - mountPath: /etc/kubernetes/project-discovery/auth
                    name: discovery-kubeconfig
                    readOnly: true
