apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: Deployment
      name: stripe-provider
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/0
      - op: remove
        path: /spec/template/spec/volumes/0
  - target:
      kind: Deployment
      name: stripe-provider
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: stripe-provider
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                  - name: KUBECONFIG
                    value: /etc/kubernetes/project-discovery/auth/kubeconfig.yaml
                  - name: LEADER_ELECT_NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
