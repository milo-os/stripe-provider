# StripePaymentMethod is the per-customer setup state owned by the
# stripe-provider controller. Surfacing it as a ProtectedResource
# lets follow-up PolicyBindings grant per-org read access so the
# portal can poll status.setupIntent.clientSecret while rendering
# the Stripe Elements form (see payment-methods.md step 6).
apiVersion: iam.miloapis.com/v1alpha1
kind: ProtectedResource
metadata:
  name: stripe.billing.miloapis.com-stripepaymentmethod
spec:
  serviceRef:
    name: "stripe.billing.miloapis.com"
  kind: StripePaymentMethod
  plural: stripepaymentmethods
  singular: stripepaymentmethod
  permissions:
    - list
    - get
    - create
    - update
    - patch
    - delete
    - watch
  # StripePaymentMethod is created by the stripe-provider controller as
  # an owner-referenced child of a billing.miloapis.com PaymentMethod,
  # which itself lives in an Organization-scoped namespace
  # (organization-<slug>). Declaring Organization as the parent lets
  # operators issue a single org-scoped PolicyBinding (e.g. to a viewer
  # role) and have it propagate down to every StripePaymentMethod under
  # that org, mirroring the pattern milo-os/billing uses for
  # BillingAccount.
  parentResources:
    - apiGroup: resourcemanager.miloapis.com
      kind: Organization
