---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: stripeinvoices.stripe.billing.miloapis.com
spec:
  group: stripe.billing.miloapis.com
  names:
    kind: StripeInvoice
    listKind: StripeInvoiceList
    plural: stripeinvoices
    singular: stripeinvoice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.billingAccountRef.name
      name: BillingAccount
      type: string
    - jsonPath: .spec.purpose
      name: Purpose
      type: string
    - jsonPath: .status.number
      name: Number
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.total
      name: Total
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          StripeInvoice is the Schema for the stripeinvoices API.

          A StripeInvoice is an invoice for Stripe to work out, as lines with a
          Product, quantity, unit price, service period and tax. It previews
          (Stripe's own preview with nothing created, or a draft that staff open in
          the Stripe dashboard and that's deleted after a day) or writes a real
          invoice: a draft kept in step with the lines, finalized on request, whose
          payment Stripe's events keep current. Previews and invoices share the same
          lines, so a preview can't drift from what's billed.

          Other controllers create StripeInvoices, in the billing account's
          namespace; staff don't. See docs/architecture/invoicing.md.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: StripeInvoiceSpec defines the desired state of a StripeInvoice.
            properties:
              billingAccountRef:
                description: |-
                  BillingAccountRef names the BillingAccount, in this namespace, whose
                  Stripe customer is invoiced. Its StripeCustomer must be Ready.
                properties:
                  name:
                    description: Name is the name of the BillingAccount.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              currency:
                default: USD
                description: Currency is the ISO 4217 currency of the amounts. USD
                  only.
                pattern: ^USD$
                type: string
              finalize:
                description: |-
                  Finalize, on an Invoice, finalizes it in Stripe once it's synced.
                  Stripe then charges the default payment method, or sends the invoice
                  for an account on payment terms. It can't be undone, and the lines
                  can't change after it.
                type: boolean
              lines:
                description: Lines are the invoice's charges, in order.
                items:
                  description: 'StripeInvoiceLine is one charge: an invoice item in
                    Stripe.'
                  properties:
                    amount:
                      description: |-
                        Amount is what the line should come to before discounts: what the
                        source charged. Stripe's amount is checked against it.
                      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                      type: string
                    description:
                      description: Description is what the invoice calls the charge.
                      maxLength: 500
                      minLength: 1
                      type: string
                    discountPercent:
                      description: |-
                        DiscountPercent is a percentage taken off the line, as a decimal
                        string (e.g. "10"). It's a Stripe coupon on the line.
                      pattern: ^(100|[1-9]?[0-9])(\.[0-9]{1,2})?$
                      type: string
                    key:
                      description: |-
                        Key identifies the line within the invoice, and is kept on the
                        Stripe line's metadata.
                      maxLength: 64
                      minLength: 1
                      type: string
                    metadata:
                      additionalProperties:
                        type: string
                      description: Metadata is copied onto the Stripe line, each key
                        prefixed "datum_".
                      maxProperties: 20
                      type: object
                    note:
                      description: |-
                        Note is for staff and finance, kept in the line's metadata. It's
                        never printed on the invoice.
                      maxLength: 500
                      type: string
                    period:
                      description: |-
                        Period is the service period the charge is for. Revenue Recognition
                        spreads the line over it.
                      properties:
                        end:
                          format: date-time
                          type: string
                        start:
                          format: date-time
                          type: string
                      required:
                      - end
                      - start
                      type: object
                      x-kubernetes-validations:
                      - message: end can't be before start
                        rule: self.end >= self.start
                    quantity:
                      description: Quantity is how many are charged, as a positive
                        decimal string.
                      pattern: ^([1-9][0-9]*(\.[0-9]+)?|0\.[0-9]*[1-9][0-9]*)$
                      type: string
                    servicePricingRef:
                      description: |-
                        ServicePricingRef names the price charged. Its StripeProduct is the
                        line's Product, so it must be Ready.
                      properties:
                        name:
                          description: Name of the ServicePricing.
                          maxLength: 253
                          minLength: 1
                          type: string
                        namespace:
                          default: milo-system
                          description: Namespace of the ServicePricing.
                          type: string
                      required:
                      - name
                      type: object
                    tax:
                      description: Tax overrides the Product's tax code for this line.
                      minProperties: 1
                      properties:
                        code:
                          description: Code is the line's Stripe tax code, in place
                            of its Product's.
                          maxLength: 64
                          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
                          type: string
                        taxable:
                          description: Taxable is false for a line that's never taxed.
                          type: boolean
                      type: object
                    unitAmount:
                      description: |-
                        UnitAmount is the price of one, before discounts, as a decimal
                        string in the currency (e.g. "300.00").
                      pattern: ^(0|[1-9][0-9]*)(\.[0-9]+)?$
                      type: string
                  required:
                  - amount
                  - description
                  - key
                  - period
                  - quantity
                  - servicePricingRef
                  - unitAmount
                  type: object
                  x-kubernetes-validations:
                  - message: tax.code can't be set on a line that isn't taxable
                    rule: '!has(self.tax) || !has(self.tax.taxable) || self.tax.taxable
                      || !has(self.tax.code)'
                maxItems: 250
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              purpose:
                description: Purpose is Preview, PreviewDraft or Invoice.
                enum:
                - Preview
                - PreviewDraft
                - Invoice
                type: string
              source:
                description: |-
                  Source is where a real invoice came from. Its ID goes on the Stripe
                  invoice's metadata, so the source's own records find it.
                properties:
                  invoiceId:
                    description: InvoiceID is the source's ID for the invoice.
                    maxLength: 128
                    minLength: 1
                    type: string
                  system:
                    description: System is the source.
                    enum:
                    - OpenMeter
                    type: string
                required:
                - invoiceId
                - system
                type: object
            required:
            - billingAccountRef
            - lines
            - purpose
            type: object
            x-kubernetes-validations:
            - message: a preview's spec is immutable; create a new StripeInvoice
              rule: oldSelf.purpose == 'Invoice' || self == oldSelf
            - message: purpose and billingAccountRef can't change
              rule: self.purpose == oldSelf.purpose && self.billingAccountRef == oldSelf.billingAccountRef
            - message: only an Invoice can be finalized
              rule: '!has(self.finalize) || !self.finalize || self.purpose == ''Invoice'''
            - message: the spec is immutable once finalize is true
              rule: '!has(oldSelf.finalize) || !oldSelf.finalize || self == oldSelf'
          status:
            description: |-
              StripeInvoiceStatus defines the observed state of a StripeInvoice.
              Amounts are decimal strings in the currency.
            properties:
              amountDue:
                description: |-
                  AmountDue is what the customer would be charged: Total with the
                  starting balance applied.
                type: string
              amountPaid:
                description: AmountPaid is what's been paid so far.
                type: string
              amountRemaining:
                description: AmountRemaining is what's still owed.
                type: string
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dashboardUrl:
                description: DashboardURL opens the draft in the Stripe dashboard.
                type: string
              discount:
                description: Discount is the sum of the discounts.
                type: string
              dueDate:
                description: DueDate is when payment is due, for an invoice that's
                  sent.
                format: date-time
                type: string
              expiresAt:
                description: |-
                  ExpiresAt is when the StripeInvoice deletes itself: an hour after
                  it's created for a Preview, a day for a PreviewDraft, which takes
                  its draft with it. An Invoice never expires.
                format: date-time
                type: string
              finalizedAt:
                description: FinalizedAt is when Stripe finalized the invoice.
                format: date-time
                type: string
              hostedInvoiceUrl:
                description: |-
                  HostedInvoiceURL is the invoice's page in Stripe, where the customer
                  reads, downloads and pays it. Set once it's finalized.
                type: string
              invoiceId:
                description: |-
                  InvoiceID is the Stripe invoice: the draft for PreviewDraft, the
                  invoice for Invoice. A Preview creates nothing, so it has none.
                type: string
              lines:
                description: Lines are Stripe's amounts for each spec line, by key.
                items:
                  description: StripeInvoiceLineStatus is Stripe's amounts for one
                    line.
                  properties:
                    amount:
                      description: Amount is Stripe's amount for the line, before
                        discounts and tax.
                      type: string
                    discount:
                      description: Discount is the line's discount.
                      type: string
                    invoiceItemId:
                      description: InvoiceItemID is the Stripe invoice item behind
                        the line.
                      type: string
                    key:
                      description: Key is the spec line's key.
                      type: string
                    tax:
                      description: Tax is the line's tax.
                      type: string
                  required:
                  - key
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
              linesHash:
                description: |-
                  LinesHash is a hash of the spec lines last written to Stripe, so a
                  change to them is seen.
                type: string
              number:
                description: |-
                  Number is the number Stripe gives an Invoice when it's finalized,
                  such as "DATUM-0042".
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
              paidAt:
                description: PaidAt is when the invoice was paid.
                format: date-time
                type: string
              startingBalance:
                description: |-
                  StartingBalance is the customer's balance that Stripe carries onto
                  the invoice: positive for what they already owe, such as an earlier
                  invoice below Stripe's minimum charge, negative for credit.
                type: string
              state:
                description: State is where an Invoice stands in Stripe.
                enum:
                - Draft
                - Open
                - Paid
                - Void
                - Uncollectible
                - Deleted
                type: string
              subtotal:
                description: Subtotal is the sum of the lines before discounts and
                  tax.
                type: string
              tax:
                description: |-
                  Tax is the tax Stripe Tax charges, from the customer's address, tax
                  IDs and exemptions and each line's tax code.
                type: string
              total:
                description: 'Total is the invoice''s total: its lines after discounts,
                  plus tax.'
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
